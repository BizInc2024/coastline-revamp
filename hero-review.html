<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero Desktop — Outpaint Review</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: -apple-system, sans-serif; padding: 40px; }
  h1 { font-size: 24px; margin-bottom: 10px; font-weight: 400; }
  p.subtitle { color: #666; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 16px; font-weight: 400; color: #888; margin-bottom: 12px; }
  .section { margin-bottom: 50px; }
  .desktop-wrap {
    width: 100%;
    max-width: 1920px;
    aspect-ratio: 16/9;
    overflow: hidden;
    border: 1px solid #333;
    border-radius: 8px;
    position: relative;
  }
  .desktop-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .label {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 4px 10px;
    font-size: 13px;
    border-radius: 4px;
  }
  .mobile-wrap {
    width: 280px;
    aspect-ratio: 9/16;
    overflow: hidden;
    border: 1px solid #333;
    border-radius: 8px;
  }
  .mobile-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .original-wrap {
    width: 400px;
    aspect-ratio: 1/1;
    overflow: hidden;
    border: 1px solid #333;
    border-radius: 8px;
  }
  .original-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .row { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
  .dim { font-size: 12px; color: #555; margin-top: 6px; }
  hr { border: none; border-top: 1px solid #222; margin: 50px 0; }
</style>
</head>
<body>
  <h1>Hero Image Review — April 2026</h1>
  <p class="subtitle">4 AI-generated 16:9 desktop variations via Nano Banana + original reference</p>

  <div class="section">
    <h2>Original Source</h2>
    <div class="row">
      <div>
        <div class="original-wrap">
          <img src="../coastline-marketing/assets/NEW IMAGE BATCH - Feb 17/lifestyle-004-teak-table-coast.jpg" alt="Original">
        </div>
        <p class="dim">1024 x 1024 — source image</p>
      </div>
      <div>
        <div class="mobile-wrap">
          <img src="assets/cc-hero-mobile-apr.jpg" alt="Mobile crop">
        </div>
        <p class="dim">1080 x 1920 — mobile (approved)</p>
      </div>
    </div>
  </div>

  <hr>

  <div class="section">
    <h2>Desktop Variation #1</h2>
    <div class="desktop-wrap">
      <span class="label">#1</span>
      <img src="../coastline-marketing/generated-images/2026-04-01/hero-desktop-outpaint/001.jpg" alt="Variation 1">
    </div>
  </div>

  <div class="section">
    <h2>Desktop Variation #2</h2>
    <div class="desktop-wrap">
      <span class="label">#2</span>
      <img src="../coastline-marketing/generated-images/2026-04-01/hero-desktop-outpaint/002.jpg" alt="Variation 2">
    </div>
  </div>

  <div class="section">
    <h2>Desktop Variation #3</h2>
    <div class="desktop-wrap">
      <span class="label">#3</span>
      <img src="../coastline-marketing/generated-images/2026-04-01/hero-desktop-outpaint/003.jpg" alt="Variation 3">
    </div>
  </div>

  <div class="section">
    <h2>Desktop Variation #4</h2>
    <div class="desktop-wrap">
      <span class="label">#4</span>
      <img src="../coastline-marketing/generated-images/2026-04-01/hero-desktop-outpaint/004.jpg" alt="Variation 4">
    </div>
  </div>

</body>
</html>
